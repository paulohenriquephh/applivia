version: "3.9"

x-common-env: &common-env
  TZ: UTC

services:
  # ============ DATA LAYER ============
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # ============ N8N ============
  n8n-editor:
    image: n8nio/n8n:1.76.1
    restart: always
    environment:
      <<: *common-env
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE}
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_METRICS: "true"
      N8N_METRICS_PREFIX: n8n_
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
      - ./n8n/init-workflows.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  n8n-worker-1:
    image: n8nio/n8n:1.76.1
    restart: always
    command: worker
    environment:
      <<: *common-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      n8n-editor:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  n8n-worker-2:
    image: n8nio/n8n:1.76.1
    restart: always
    command: worker
    environment:
      <<: *common-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      n8n-editor:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  n8n-webhooks:
    image: n8nio/n8n:1.76.1
    restart: always
    command: webhook
    environment:
      <<: *common-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5679:5678"
    depends_on:
      n8n-editor:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ CREWAI ============
  crewai-api:
    build:
      context: ./crewai-api
      dockerfile: Dockerfile
    restart: always
    environment:
      <<: *common-env
      CREWAI_API_PORT: ${CREWAI_API_PORT}
      CREWAI_API_HOST: ${CREWAI_API_HOST}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  crewai-scheduler:
    build:
      context: ./crewai-scheduler
      dockerfile: Dockerfile
    restart: always
    environment:
      <<: *common-env
      CREWAI_API_URL: http://crewai-api:8001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      crewai-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  # ============ CO-CEO ============
  co-ceo-agent:
    build:
      context: ./co-ceo-agent
      dockerfile: Dockerfile
    restart: always
    environment:
      <<: *common-env
      COCEO_API_PORT: ${COCEO_API_PORT}
      COCEO_API_HOST: ${COCEO_API_HOST}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CREWAI_API_URL: http://crewai-api:8001
      N8N_API_URL: http://n8n-editor:5678
      N8N_API_KEY: ${N8N_API_KEY}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  # ============ OPENCLAW ============
  openclaw:
    image: ghcr.io/openclaw-ai/openclaw:latest
    restart: always
    environment:
      <<: *common-env
      OPENCLAW_PORT: ${OPENCLAW_PORT}
    volumes:
      - ./openclaw:/app/config:ro
    ports:
      - "127.0.0.1:18789:18789"
    depends_on:
      crewai-api:
        condition: service_healthy
      co-ceo-agent:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ============ REVERSE PROXY ============
  caddy:
    image: caddy:2-alpine
    restart: always
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - n8n-editor
      - n8n-webhooks
      - crewai-api
      - co-ceo-agent
      - grafana
      - metabase
      - appsmith
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ OBSERVABILITY ============
  grafana:
    image: grafana/grafana:11.4.0
    restart: always
    environment:
      <<: *common-env
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M

  metabase:
    image: metabase/metabase:v0.52.5
    restart: always
    environment:
      <<: *common-env
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_HOST: ${MB_DB_HOST}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  appsmith:
    image: appsmith/appsmith-ce:v1.52
    restart: always
    volumes:
      - appsmith_data:/appsmith-stacks
    ports:
      - "127.0.0.1:3002:80"
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: always
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          memory: 128M

  # ============ TELEGRAM BOT ============
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    restart: always
    environment:
      <<: *common-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CREWAI_API_URL: http://crewai-api:8001
      COCEO_API_URL: http://co-ceo-agent:8002
      N8N_API_URL: http://n8n-editor:5678
      N8N_API_KEY: ${N8N_API_KEY}
    depends_on:
      crewai-api:
        condition: service_healthy
      co-ceo-agent:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  n8n_data:
  caddy_data:
  caddy_config:
  grafana_data:
  prometheus_data:
  appsmith_data:
