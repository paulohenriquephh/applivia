global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "crewai-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["crewai-api:8001"]
    scrape_interval: 30s

  - job_name: "n8n"
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n-editor:5678"]
    scrape_interval: 30s

  - job_name: "caddy"
    static_configs:
      - targets: ["caddy:2019"]
    scrape_interval: 30s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
    scrape_interval: 15s
